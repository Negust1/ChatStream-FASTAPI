[project]
name = "chatbot-api"
version = "0.1.0"
description = "FastAPI Chatbot API"
authors = [
    {name = "Negust1",email = "negust1@outlook.es"}
]
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn[standard] (>=0.46.0,<0.47.0)",
    "sqlalchemy[asyncio] (>=2.0.49,<3.0.0)",
    "litellm (>=1.83.14,<2.0.0)",
    "pydantic (==2.12.5)",
    "pydantic[email] (==2.12.5)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "anthropic (>=0.97.0,<0.98.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "slowapi (>=0.1.9,<0.2.0)",
    "fastapi-limiter (>=0.2.0,<0.3.0)",
    "python-jose (>=3.5.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
